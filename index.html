<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>เกมความรู้ทางเคมี - การแก้ปัญหาพอลิเมอร์</title>
  <link rel="stylesheet" href="css/style.css?v=7">
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <!-- 🗺️ Mini-map (มุมขวาบน) -->
    <div id="minimap-container">
      <canvas id="minimapCanvas" width="160" height="120"></canvas>
    </div>

    <!-- 📖 ปุ่มไอคอนหนังสือเปิดอ่านเนื้อหากลางจอด้านบน -->
    <div id="book-icon-btn" onclick="openStudyInGame()" title="อ่านเนื้อหาทบทวน">
      📖
    </div>

    <!-- 🎮 UI แสดงคะแนน เวลา และความคืบหน้า (มุมซ้ายบน) -->
    <div id="game-ui">
      <div class="ui-card">
        <div class="ui-row">
          <span class="ui-label">SCORE</span>
          <span id="score-text" class="ui-value">0</span>
        </div>
        <div class="ui-row">
          <span class="ui-label">TIME</span>
          <span id="timer-text" class="ui-value">00:00</span>
        </div>
        <div class="ui-row">
          <span class="ui-label">PROGRESS</span>
          <span id="progress-text" class="ui-value">0 / 20</span>
        </div>
      </div>
    </div>

    <!-- 🕹️ Virtual Joystick สำหรับมือถือ & แท็บเล็ต (มุมซ้ายล่าง) -->
    <div id="joystick-zone">
      <div id="joystick-base">
        <div id="joystick-stick"></div>
      </div>
    </div>

    <!-- 🚀 Modals หน้าเมนูเริ่มต้น (Start Screen) -->
    <div id="startMenuModal" class="modal" style="display: flex;">
      <div class="modal-content">
        <h2>🎮 ยินดีต้อนรับสู่เกม Polymer Quiz</h2>
        <p style="color: #64748b; margin-bottom: 20px; font-size: 14px;">
          โปรดเลือกโหมดที่ต้องการก่อนเริ่มออกสำรวจ
        </p>
        <div style="display: flex; flex-direction: column; gap: 12px;">
          <button class="btn-action" onclick="showStudyGuide()">📖 อ่านเนื้อหาทบทวนความรู้</button>
          <button class="btn-action" style="background: #16a34a;" onclick="startGameDirectly()">⚔️ ลุยเลย! เริ่มเล่นเกม</button>
        </div>
      </div>
    </div>

    <!-- 📖 Modals อ่านเนื้อหาทบทวน (แสดงรูปภาพสรุปขนาดใหญ่) -->
    <div id="studyModal" class="modal">
      <div class="modal-content study-modal-large">
        <div class="study-header">
          <h2>📖 สรุปเนื้อหาความรู้พอลิเมอร์และการจัดการขยะ</h2>
          <span class="close-btn" onclick="closeStudyGuide()">&times;</span>
        </div>
        
        <div class="study-image-container">
          <img src="assets/intelligen.jpg" alt="สรุปความรู้เรื่องพอลิเมอร์และการจัดการขยะพอลิเมอร์" class="study-img-a4">
        </div>

        <button class="btn-action" onclick="closeStudyGuide()" style="margin-top: 15px; width: 100%; max-width: 300px;">เข้าใจแล้ว ไปเริ่มเล่นเกมกันเลย!</button>
      </div>
    </div>

    <!-- Modals อื่นๆ -->
    <div id="quizModal" class="modal">
      <div class="modal-content">
        <h3>คำถามเกี่ยวกับพอลิเมอร์</h3>
        <div class="scenario-box" id="scenarioText"></div>
        
        <button id="hintBtn" class="hint-btn" onclick="toggleHint()">💡 ดูคำใบ้</button>
        <div id="hintBox" class="hint-box" style="display: none;"></div>

        <div class="options-grid" id="optionsContainer"></div>
      </div>
    </div>

    <div id="resultModal" class="modal">
      <div class="modal-content">
        <h2 id="resultTitle"></h2>
        <p id="resultDetail"></p>
        <button class="btn-action" onclick="closeResult()">ดำเนินการต่อ ></button>
      </div>
    </div>

    <!-- 🏆 หน้าสรุปผล + บันทึกชื่อลง Leaderboard -->
    <div id="summaryModal" class="modal">
      <div class="modal-content">
        <h2>🏆 สรุปผลการเรียนรู้</h2>
        <div id="finalScore" class="score-display"></div>
        <p id="badgeText">ยอดเยี่ยม! คุณคือผู้เชี่ยวชาญพอลิเมอร์</p>
        
        <div class="leaderboard-input-box" style="margin: 15px 0;">
          <input type="text" id="playerNameInput" placeholder="กรอกชื่อของคุณ..." maxlength="12" style="padding: 10px; font-size: 16px; border-radius: 6px; border: 2px solid #facc15; text-align: center; width: 80%;">
          <button class="btn-action" onclick="submitScore()" style="margin-top: 10px; background: #eab308;">💾 บันทึกคะแนน</button>
        </div>

        <button class="btn-action" onclick="resetGame()" style="background: #475569;">เล่นใหม่อีกครั้ง</button>
      </div>
    </div>

    <!-- 📊 หน้าต่าง Leaderboard -->
    <div id="leaderboardModal" class="modal">
      <div class="modal-content">
        <h2>🥇 ตารางอันดับผู้เล่น (Top 10)</h2>
        <div id="leaderboardList" class="leaderboard-list"></div>
        <button class="btn-action" onclick="closeLeaderboard()" style="margin-top: 15px;">ปิดหน้านี้</button>
      </div>
    </div>

  </div>

  <script src="js/data.js"></script>
  <script src="js/Player.js"></script>
  <script src="js/CheckBall.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
