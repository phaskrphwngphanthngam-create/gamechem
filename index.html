<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>เกมความรู้ทางเคมี - การแก้ปัญหาพอลิเมอร์</title>
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="controls-hint">🎮 ใช้ ปุ่มลูกศร / WASD หรือ ปุ่มสัมผัสบนจอ ในการเดิน</div>

    <!-- 📱 ปุ่มสัมผัสสำหรับมือถือ / iPad (Virtual D-Pad) -->
    <div id="touch-controls">
      <button class="dpad-btn btn-up" id="btn-up">▲</button>
      <div class="dpad-middle">
        <button class="dpad-btn btn-left" id="btn-left">◀</button>
        <div class="dpad-center"></div>
        <button class="dpad-btn btn-right" id="btn-right">▶</button>
      </div>
      <button class="dpad-btn btn-down" id="btn-down">▼</button>
    </div>

    <!-- Modals -->
    <div id="quizModal" class="modal">
      <div class="modal-content">
        <h3>คำถามเกี่ยวกับพอลิเมอร์</h3>
        <div class="scenario-box" id="scenarioText"></div>
        
        <button id="hintBtn" class="hint-btn" onclick="toggleHint()">💡 ดูคำใบ้</button>
        <div id="hintBox" class="hint-box" style="display: none;"></div>

        <div class="options-grid" id="optionsContainer"></div>
      </div>
    </div>

    <div id="resultModal" class="modal">
      <div class="modal-content">
        <h2 id="resultTitle"></h2>
        <p id="resultDetail"></p>
        <button class="btn-action" onclick="closeResult()">ดำเนินการต่อ ></button>
      </div>
    </div>

    <div id="summaryModal" class="modal">
      <div class="modal-content">
        <h2>🏆 สรุปผลการเรียนรู้</h2>
        <div id="finalScore" class="score-display"></div>
        <p id="badgeText">ยอดเยี่ยม! คุณคือผู้เชี่ยวชาญพอลิเมอร์</p>
        <button class="btn-action" onclick="resetGame()">เล่นใหม่อีกครั้ง</button>
      </div>
    </div>
  </div>

  <script src="js/data.js?v=3"></script>
  <script src="js/Player.js?v=3"></script>
  <script src="js/CheckBall.js?v=3"></script>
  <script src="js/quiz.js?v=3"></script>
  <script src="js/main.js?v=3"></script>
</body>
</html>
